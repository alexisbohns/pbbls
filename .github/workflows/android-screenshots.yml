name: Android screenshots (re-baseline)

# Regenerates the committed screenshot baseline under
# apps/android/app/src/screenshotTestDebug/reference/ and pushes it.
#
# android.yml validates that baseline on every PR, so a change that moves a
# rendered pixel on purpose lands red until the references are regenerated. This
# workflow is that one command. It is deliberately NOT part of android.yml: it is
# the only Android workflow that writes to the repository, and the pre-merge gate
# stays read-only.
#
# Two ways in, both manual:
#   - label a PR `rebaseline-screenshots` — the new PNGs are committed to the PR
#     branch (same-repo PRs only; a fork PR skips, see the job's `if`)
#   - run it from the Actions tab on any ref
#
# The references are rendered on ubuntu-latest here and validated on
# ubuntu-latest there, so the baseline and its oracle always come off the same
# renderer. Regenerating them on a developer machine is fine to LOOK at, but do
# not commit those: layoutlib's text rasterization is not guaranteed to agree
# across host platforms, and a macOS-rendered baseline would fail CI forever.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebaseline:
    # The `labeled` event fires for every label, so gate on the one that means
    # it. A fork's head branch does not exist in this repository and its token
    # cannot push, so skip rather than fail the checkout on a run that could
    # never have finished.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.label.name == 'rebaseline-screenshots' &&
           github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Re-render and commit the screenshot baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a pull_request event the default checkout is the merge commit,
          # which is detached and cannot be pushed. Take the head branch instead.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # Same env as android.yml's validate step, for the same reason: keep
      # BuildConfig identical so the renders are not rebuilt against different
      # values than the gate compares them with.
      - name: Re-render the reference images
        working-directory: apps/android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew updateDebugScreenshotTest

      # `update` rewrites every reference in place, so "nothing changed" is the
      # normal outcome and must not fail the run.
      - name: Commit the baseline
        id: commit
        env:
          TARGET_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/app/src/screenshotTestDebug/reference

          if git diff --cached --quiet; then
            echo "The baseline already matches this revision — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "test(android): re-baseline screenshot references"

          # Never write the baseline straight onto the default branch: a
          # re-baseline is a reviewable change like any other. From main it goes
          # onto its own branch for a PR; from a feature branch it goes home.
          if [ "$TARGET_REF" = "$DEFAULT_BRANCH" ]; then
            branch="test/screenshot-rebaseline-${GITHUB_RUN_NUMBER}"
            git push origin "HEAD:refs/heads/$branch"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "Pushed $branch — open a PR from it."
          else
            git push origin "HEAD:$TARGET_REF"
            echo "branch=$TARGET_REF" >> "$GITHUB_OUTPUT"
          fi

      # The push above is attributed to github-actions[bot], and GitHub holds
      # workflow runs whose triggering actor is a bot: android.yml IS queued
      # against the new commit, but it sits at `action_required` until a human
      # with write access approves it. Until then the PR still shows the failed
      # check that sent you here, which looks exactly like the re-baseline having
      # done nothing. Say what to do instead of leaving that to be rediscovered.
      #
      # "Re-run the Android workflow" would be wrong advice: a re-run replays the
      # SHA it was created for, which is the pre-baseline tree, so it fails again.
      - name: Next step
        if: ${{ steps.commit.outputs.changed == 'true' }}
        run: |
          {
            echo "Baseline committed to \`${{ steps.commit.outputs.branch }}\`."
            echo
            echo "**The Android check is not green yet.** This push is attributed to"
            echo "\`github-actions[bot]\`, so the runs queued against the new commit are held"
            echo "at \`action_required\` pending approval. Do one of:"
            echo
            echo "- approve them from the PR's **Checks** tab, or"
            echo '  `gh api --method POST repos/${{ github.repository }}/actions/runs/<run-id>/approve`'
            echo "- push any further commit yourself, which runs them without approval"
            echo
            echo "Do **not** re-run the failed Android run: a re-run replays the commit it was"
            echo "created for, which is the tree from before the re-baseline."
          } >> "$GITHUB_STEP_SUMMARY"
