name: Android

# The repository's first CI workflow (D12). Path-filtered to the Android app so
# it stays dormant for web/admin/ios changes. No secrets needed: the build
# defaults BuildConfig values to empty strings when secrets.properties is absent
# (D8).
#
# This workflow is the PRE-MERGE gate; android-release.yml only runs after merge.
# So everything that can break the shipped artifact has to be exercised here:
# Android Lint (baselined, warnings-as-errors) and an UNSIGNED `bundleRelease`,
# which is what runs R8 and lint-vital. A broken keep rule or a lint-vital error
# fails the PR instead of failing the deploy (#845).
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Android Lint publishes its SARIF report to GitHub code scanning.
  security-events: write

jobs:
  build:
    name: ktlint · lint · unit tests · assemble · bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Validate the committed wrapper JAR against known-good checksums.
          validate-wrappers: true

      # Bake the Supabase config into the debug APK from repo Actions secrets so
      # the CI artifact is installable-and-functional (the maintainer has no
      # local Android SDK). build.gradle.kts reads these env vars when
      # secrets.properties is absent. Both values are publishable — the anon key
      # already ships in the web and iOS clients — so a downloadable debug
      # artifact adds no exposure. If the secrets are unset (e.g. a fork), the
      # values default to empty and AppEnvironment fails loud at launch (D8).
      #
      # testDebugUnitTest also runs the Robolectric Compose UI suite (#857) —
      # whole-app tests over fakes, no emulator. The Kover reports ride the same
      # invocation so the tests run once, instrumented.
      - name: ktlint, unit tests, coverage, assemble debug APK
        working-directory: apps/android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew ktlintCheck testDebugUnitTest koverXmlReportDebug koverHtmlReportDebug assembleDebug

      # Coverage is reported, not gated (#857): the totals and a per-package
      # table go to this run's summary, the HTML report to an artifact. Runs even
      # when a test failed, so a red run still says what it covered.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('apps/android/app/build/reports/kover/reportDebug.xml') != '' }}
        working-directory: apps/android
        run: python3 scripts/kover-summary.py app/build/reports/kover/reportDebug.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-coverage
          path: apps/android/app/build/reports/kover/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The screenshot suite is a validation gate (#847). Every @PreviewTest is
      # re-rendered and diffed against the PNG committed under
      # apps/android/app/src/screenshotTestDebug/reference/; a rendered pixel that
      # moves past the threshold in app/build.gradle.kts fails the PR here. This
      # replaced `updateDebugScreenshotTest`, which re-rendered the references in
      # place and so could never fail — render-to-view, not an oracle.
      #
      # A PR that changes UI on purpose is therefore red until its baseline is
      # regenerated: label it `rebaseline-screenshots` and android-screenshots.yml
      # commits the new PNGs to the branch. Reviewing the UI no longer needs an
      # artifact download either — the references are in the repo, and the PR diff
      # shows before/after for every render that moved.
      #
      # The Supabase config is passed here only to keep BuildConfig identical to
      # the steps around it; flipping those values between steps invalidates the
      # Kotlin compilation and rebuilds the app twice per run. Nothing rendered
      # reads AppEnvironment, so the baseline does not depend on the secrets being
      # present — which matters, because a fork PR has none.
      - name: Validate UI screenshots
        working-directory: apps/android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew validateDebugScreenshotTest

      # The reference/actual/diff triptych for whatever failed, so the change is
      # reviewable without an SDK. Only uploaded on failure: on a green run the
      # renders are byte-identical to the committed references.
      - name: Upload UI screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshot-diffs
          path: |
            apps/android/app/build/reports/screenshotTest/preview/debug/**
            apps/android/app/build/outputs/screenshotTest-results/preview/debug/**
          if-no-files-found: warn

      # Android Lint with `warningsAsErrors` + a committed baseline
      # (apps/android/app/lint-baseline.xml). Anything already in the baseline is
      # filtered out; anything new fails the PR. Regenerate the baseline with
      # `./gradlew updateLintBaseline` only when an issue is deliberately accepted.
      - name: Android Lint
        working-directory: apps/android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew lint

      # Fork PRs get a read-only GITHUB_TOKEN, so the code-scanning upload would
      # fail there; the lint step above has already failed the job on any real
      # finding, so skipping the upload loses no signal.
      - name: Upload lint SARIF to code scanning
        if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: apps/android/app/build/reports/lint-results-debug.sarif
          category: android-lint

      # The real reason this step exists: `bundleRelease` is the only task that
      # runs R8 and lintVitalRelease. Without a keystore the AAB comes out
      # unsigned (the D8 fail-soft contract) and nothing is published — this is a
      # build gate, not a release. android-release.yml still owns publishing.
      - name: Assemble release bundle (R8 + lint-vital gate)
        working-directory: apps/android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew bundleRelease
