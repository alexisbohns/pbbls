name: Android Release

# Builds a SIGNED release AAB and publishes it to Google Play. Every merge goes
# to internal testing, so the maintainer's phone auto-updates via the Play Store
# instead of the manual download/unzip/upload/verify/install loop.
#
# Three ways in:
#   • push to main (apps/android/**)  → auto-publish to internal testing
#   • a PR labelled `deploy-beta`     → publish THAT branch to the phone (opt-in)
#   • manual "Run workflow"           → workflow_dispatch, pick a branch and a track
#
# Tracks (#1452). Only a manual run picks one; everything else is internal.
#   • internal    → rolled out at once (status: completed), any branch
#   • closed      → Play's closed-testing track `alpha`, uploaded as a DRAFT
#   • production  → uploaded as a DRAFT
# A draft is a release waiting in the Console: write its notes there and press
# "Start rollout" yourself. Closed and production only run from main, so what the
# testers and the store get is always something that was merged.
#
# The AAB is minified and shrunk by R8 (#845); its mapping file is uploaded to
# Play so Console crashes deobfuscate, and kept as a workflow artifact too.
#
# The AAB is ALWAYS uploaded as a workflow artifact too. The Play Publishing API
# refuses to create an app's first-ever release, so the very first upload must be
# done by hand in the Console — download this artifact once and upload it there to
# seed internal testing. After that, every run publishes automatically.
#
# Bootstrap is fail-soft: before the keystore / service-account secrets exist the
# job still runs — it just produces an (unsigned) AAB artifact and skips the
# publish step — so nothing goes red while the one-time console setup is pending.
# See docs/android-play-deploy.md for the full runbook.
on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    types: [labeled, synchronize]
    paths:
      - 'apps/android/**'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track. closed and production upload a draft you roll out from the Console (main only).'
        type: choice
        options: [internal, closed, production]
        default: internal

# The track is part of the group so a manual closed or production run never
# cancels the internal publish of the merge it was started from, or vice versa.
concurrency:
  group: android-release-${{ github.ref }}-${{ inputs.track || 'internal' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: bundle · sign · publish (${{ inputs.track || 'internal' }})
    runs-on: ubuntu-latest
    # PRs only build when they carry the `deploy-beta` label; push and manual
    # dispatch always run. (A `labeled` event for any other label starts the
    # workflow but this guard skips the job.)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'deploy-beta')
    env:
      # Mirror the two "does the secret exist yet?" values into env so later steps
      # can gate on them — a step `if:` can read `env.*` but not `secrets.*`.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      # The Play API's names: the Console's "Closed testing - Alpha" track is
      # `alpha`. Push and PR runs have no inputs, so they fall through to internal.
      PLAY_TRACK: ${{ inputs.track == 'closed' && 'alpha' || inputs.track || 'internal' }}
      PLAY_STATUS: ${{ (inputs.track == 'closed' || inputs.track == 'production') && 'draft' || 'completed' }}
    steps:
      - name: Refuse a public track from a branch other than main
        if: ${{ env.PLAY_TRACK != 'internal' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::The ${{ inputs.track }} track only publishes from main (this run is on ${{ github.ref_name }})."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Decode upload keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: apps/android
        run: echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks

      # bundleRelease reads the Supabase config (baked into BuildConfig, same as
      # the debug APK) and the upload key. versionCode derives from
      # GITHUB_RUN_NUMBER — monotonic within this workflow, which is exactly what
      # Play requires (every upload must have a strictly higher versionCode).
      # versionName is `pbbls.versionName` in apps/android/gradle.properties,
      # bumped by hand in the PR that prepares a release (#1451).
      - name: Assemble signed release AAB
        working-directory: apps/android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_FILE: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # The petroglyph wobble (#555) is a shipped visual on iOS and web since
          # #727/#729, so every track carries it, closed and production included
          # (decision log 2026-11-02, superseding the "flip it off before a
          # public track" note of 2026-07-14).
          WOBBLE_ENABLED: 'true'
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # The AAB is minified and obfuscated (#845), so the mapping file is the only
      # way to read a stack trace from it. Keep a copy per run even when the
      # publish step below is skipped — a build whose mapping is lost is a build
      # whose crashes can never be decoded.
      - name: Upload R8 mapping artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-mapping
          path: apps/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # Skips until the Play service-account secret exists, so the pre-setup runs
      # still hand you the AAB artifact to seed the first release manually without
      # failing the job. Once the secret is set, every run publishes to its track.
      - name: Publish to Play (${{ env.PLAY_TRACK }}, ${{ env.PLAY_STATUS }})
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.pbbls.android
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          # Ships the R8 mapping alongside the bundle so Play Console deobfuscates
          # crashes and ANRs for this versionCode instead of showing bare frames.
          mappingFile: apps/android/app/build/outputs/mapping/release/mapping.txt
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}
