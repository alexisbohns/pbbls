name: iOS

# Two jobs, split by what they actually need:
#
#   verify — static checks needing no Xcode, on ubuntu in seconds. Paying for
#            macOS to assert that a file exists is how such a check ends up
#            disabled.
#   test   — SwiftLint and the Swift Testing suite, which need a Mac and a
#            simulator. Until #789 nothing ran either on a pull request: the
#            suite and the lint config both existed and neither was a gate, so
#            an iOS regression merged green-by-absence and shipped at the next
#            TestFlight build. Xcode Cloud does not close this — ci_scripts/
#            covers build setup only, and SwiftLint is not even installed there.
#
# `packages/supabase/**` is in the path filter on purpose. The database is the
# contract between four clients, so a migration that changes a shape iOS decodes
# is exactly the change that should run the iOS decoding tests — and that PR
# touches no apps/ios file, which is how the hole stayed open. The cost is that
# a supabase-only PR also runs the two ubuntu checks; they pass in seconds.
#
# macOS minutes are free on public repositories, so the gate is not billed.
on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'packages/supabase/**'
      # The iOS colours are generated from the Android palette by a web script,
      # so a palette change that touches no apps/ios file must still run the
      # drift check below (web.yml catches it too, via Vitest).
      - 'apps/android/app/src/main/kotlin/app/pbbls/android/core/designsystem/ColorSchemes.kt'
      - 'apps/web/lib/theme/**'
      - 'apps/web/scripts/generate-ios-colors.ts'
      - 'apps/android/app/src/main/res/font/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'packages/supabase/**'
      # The iOS colours are generated from the Android palette by a web script,
      # so a palette change that touches no apps/ios file must still run the
      # drift check below (web.yml catches it too, via Vitest).
      - 'apps/android/app/src/main/kotlin/app/pbbls/android/core/designsystem/ColorSchemes.kt'
      - 'apps/web/lib/theme/**'
      - 'apps/web/scripts/generate-ios-colors.ts'
      - 'apps/android/app/src/main/res/font/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: privacy manifests · colour contrast · colour drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The colorsets and Shared/Theme/PebblesColors.swift are generated from
      # ColorSchemes.kt. Regenerating must leave apps/ios untouched. `git status`
      # rather than `git diff`, which would miss a new, uncommitted colorset.
      - name: Check colour drift
        run: |
          npm run generate:ios-colors --workspace=@pbbls/web
          if [ -n "$(git status --porcelain -- apps/ios)" ]; then
            echo "apps/ios colours differ from ColorSchemes.kt. Run 'npm run generate:colors --workspace=@pbbls/ios' and commit:"
            git status --porcelain -- apps/ios
            exit 1
          fi

      # Both bundles carry a manifest, and the required-reason declarations
      # still match what the Swift sources actually call. Undeclared usage is
      # an ITMS-91053 rejection on upload; a stale declaration describes code
      # that no longer exists.
      - name: Verify privacy manifests
        run: npm run verify:privacy --workspace=@pbbls/ios

      # M3/googleCapsuleInk stays a single-appearance colorset clearing WCAG AA on
      # the pinned white Google capsule. The Swift mirror of this assertion
      # needs a simulator; this half does not.
      - name: Verify colour contrast
        run: npm run verify:contrast --workspace=@pbbls/ios

      # The variable Ysabeau is one font on both native apps (#1158): the
      # Spine's rank table on each surface pins the same `wght` values, so a
      # different file is a different design. Android is the source; a font
      # bump there turns this check red until apps/ios carries the same bytes
      # (the path filter above includes Android's font folder for that reason).
      - name: Verify Ysabeau matches Android
        run: |
          cmp "apps/ios/Pebbles/Resources/Ysabeau.ttf" "apps/android/app/src/main/res/font/ysabeau.ttf"
          cmp "apps/ios/Pebbles/Resources/Ysabeau Italic.ttf" "apps/android/app/src/main/res/font/ysabeau_italic.ttf"

  test:
    name: swiftlint · unit tests
    # macos-26 is the arm64 image. Xcode 26 is a floor, not a preference: the
    # karma pastille compiles `.glassEffect` behind an `if #available(iOS 26, *)`
    # guard, which needs the iOS 26 SDK to build at all.
    runs-on: macos-26
    # The reference images depend on the simulator runtime, so the whole test
    # job runs on one pinned device and runtime (#1159): iPhone 17 on iOS 26.2,
    # the runtime Xcode 26.3's SDK targets on this image. Moving either is a
    # deliberate PR that re-baselines every reference in one reviewed commit.
    env:
      SIM_DEVICE: iPhone 17
      SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
      TEST_RUNNER_TZ: Europe/Paris
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned for the same reason project.yml pins its packages: a gate that
      # compiles something other than what ships is not evidence about what
      # ships. 26.3 (17C529) is the build the maintainer's machine runs. The
      # image default, 26.6, fails BannerAspectTests.cgRatioValues() on an exact
      # CGFloat comparison that passes on 26.3 — unexplained, tracked in #793.
      # Raising this pin is that issue's job, not a drive-by.
      - name: Select Xcode 26.3
        run: |
          if [ ! -d /Applications/Xcode_26.3.app ]; then
            echo "Xcode 26.3 is gone from the runner image. Installed:"
            ls -d /Applications/Xcode*.app
            echo "Pick the closest version and update #793 rather than silently taking the default."
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      # Neither tool ships on the runner image. XcodeGen is the same install
      # Xcode Cloud's ci_post_clone.sh does.
      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      # Config/Secrets.xcconfig is git-ignored, and project.yml names it as the
      # base config file for both shippable targets, so it has to exist before
      # the project is generated. The values are placeholders rather than repo
      # secrets: the suite is offline, and the only thing that reads them is
      # AppEnvironment, which fatalErrors on an EMPTY value (SupabaseService()
      # is constructed in a test) and never dials the URL. Placeholders also
      # mean the job works on a fork PR, where secrets are unavailable. If a
      # test ever needs to reach a real project, that is the moment to swap in
      # secrets.SUPABASE_URL / secrets.SUPABASE_ANON_KEY — not before.
      #
      # The $() escape is required: xcconfig parses // as a comment.
      - name: Write placeholder Secrets.xcconfig
        working-directory: apps/ios
        run: |
          cat > Config/Secrets.xcconfig <<'EOF'
          SUPABASE_URL = https:/$()/placeholder.supabase.co
          SUPABASE_ANON_KEY = placeholder-anon-key
          EOF

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      # Runs the committed .swiftlint.yml, which is tuned so that error severity
      # means "defect" and warnings stay advisory — see the note at the top of
      # that file. Non-blocking warnings still print here.
      - name: SwiftLint
        working-directory: apps/ios
        run: swiftlint

      # Pinned, not resolved: a reference rendered on whatever iPhone the image
      # carries makes a drift impossible to bisect. Fails loudly when the image
      # drops the pin, like the Xcode check above.
      - name: Resolve the pinned simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"].get(os.environ["SIM_RUNTIME"], [])
          match = [d["udid"] for d in devices if d["name"] == os.environ["SIM_DEVICE"]]
          if not match:
              raise SystemExit("%s on %s is gone from the runner image; raise the pin in its own PR and re-baseline" % (os.environ["SIM_DEVICE"], os.environ["SIM_RUNTIME"]))
          print(match[0])
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -F "$udid"

      # CODE_SIGNING_ALLOWED=NO because project.yml carries a DEVELOPMENT_TEAM
      # and the runner holds no identity; a simulator build needs neither.
      - name: Run tests
        working-directory: apps/ios
        run: |
          xcodebuild test \
            -scheme Pebbles \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -skipMacroValidation \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      # `String(localized:)` ignores the SwiftUI environment, so French is a
      # second process-level pass over the references only. Each reference
      # declares its locales and returns without a check in the other pass.
      # It runs even when the English pass failed, so one round trip uploads
      # both locales' diffs; it still needs the pinned simulator.
      - name: French references
        if: ${{ !cancelled() && steps.sim.outcome == 'success' }}
        working-directory: apps/ios
        run: |
          xcodebuild test-without-building \
            -scheme Pebbles \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -testLanguage fr \
            -testRegion FR \
            -only-testing:PebblesTests/References \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      # The .xcresult is the readable account of which @Test failed, and -quiet
      # keeps the log short enough to be worth reading. Kept only on a red run;
      # -derivedDataPath above is what makes the location predictable.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: apps/ios/build/Logs/Test/*.xcresult
          if-no-files-found: ignore

      # <name>.actual.png and <name>.diff.png (differing pixels in magenta) for
      # every reference that moved. A change that moves pixels on purpose is
      # re-baselined with the `rebaseline-ios-screenshots` label; never widen
      # ReferenceImage.threshold instead.
      - name: Upload reference diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reference-diffs
          path: apps/ios/build/reference-diffs/**
          if-no-files-found: ignore
