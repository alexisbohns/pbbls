name: Supabase

# The database is the contract between four clients, and until #741 nothing
# guarded it: a PR touching only migrations got two Vercel builds proving the
# web and admin apps still compile, which they would with or without any schema
# change. Three jobs now stand between a migration and `main`, and they answer
# three different questions:
#
#   checks   does the code compile?            secretless, no containers
#   schema   does the schema build from zero?  secretless, local stack
#   verify   does the contract still hold?     production writes, same-repo only
#
# `verify` is the oldest and the sharpest. The `verify-*` harnesses in
# packages/supabase/scripts/ are the actual proof for anything crossing a
# surface boundary — they are acceptance tests, not simulations: each signs up
# throwaway users against the LINKED PRODUCTION project, exercises the real RLS
# policies, triggers, RPCs and the real delete-account edge function, then
# deletes what it made in a `finally`.
#
# Because that means writing to production, the triggers are deliberately
# narrow (D-2026-09-02):
#
#   pull_request  — only when packages/supabase/** changed, and only from a
#                   branch in this repo. Blocks the merge.
#   schedule      — nightly against main, so a guard dropped by a migration
#                   that nobody path-matched surfaces within a day. Red run is
#                   the notification; it opens no issue.
#   dispatch      — manual re-run after a production fix.
#
# verify-account-purge.ts is NOT here. It is the one harness needing
# SUPABASE_SERVICE_ROLE_KEY, and this repo is public — a leaked service-role key
# is total database access. It stays a manual run (`npm run db:verify:purge`),
# per the standing rule in packages/supabase/CLAUDE.md.
on:
  pull_request:
    paths:
      - 'packages/supabase/**'
      - '.github/workflows/supabase.yml'
  schedule:
    # 04:17 UTC — off the hour, so it does not queue behind the top-of-hour rush.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Grouped by ref, never cancelling in flight: a run killed between signup and
# the `finally` leaves an orphan account behind. Concurrency is workflow-level,
# so `checks` and `schema` inherit a policy written for `verify` — they would be
# safe to cancel, and queueing them costs a minute on a rapid re-push. That is
# the cheaper half of the trade against splitting them into a second workflow
# and losing the shared header, the shared path filter, and one place to look. Superseding a run that has not
# started yet is free (it signed nothing up), so a rapid second push to the same
# PR queues rather than racing. Runs from DIFFERENT refs are allowed to overlap:
# every harness namespaces its users by a per-run uuid and asserts only on rows
# its own user owns (RLS-scoped reads, own-user counts), so two runs cannot see
# each other's data.
concurrency:
  group: supabase-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # The scheduled run opens (or comments on) one tracking issue when it goes
  # red; the PR trigger never touches issues, because a red check already
  # blocks the merge.
  issues: write

jobs:
  verify:
    name: contract harnesses
    # Fork PRs get no secrets, so the harnesses would fail with "SUPABASE_URL and
    # SUPABASE_ANON_KEY must be set" on every outside contribution. Skip the job
    # instead (skipped counts as success for branch protection). `pull_request_target`
    # is the wrong fix here: it would hand repository secrets to fork-authored code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Fail with a readable message rather than five identical exit-2s if the
      # secrets are ever unset on a same-repo run.
      - name: Check credentials are present
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY are not set for this run."
            exit 1
          fi

      # Two ledgers the harness steps append to: one row per harness for the
      # summary table, one label per FAILING harness for the tracking issue.
      # Set here rather than in the job's `env:`, where the `runner` context is
      # not available and fails the whole workflow at parse time.
      - name: Prepare the run log
        run: |
          echo "HARNESS_ROWS=$RUNNER_TEMP/harness-rows.txt"         >> "$GITHUB_ENV"
          echo "HARNESS_FAILURES=$RUNNER_TEMP/harness-failures.txt" >> "$GITHUB_ENV"

      # One step per harness so a red check names the contract that broke, and
      # `!cancelled()` so one failure still reports the other three — each cleans
      # up after itself in a `finally`, so a failed run leaves nothing behind.
      # The wrapper adds the summary row and preserves the harness's exit code.
      - name: Pebble drafts (M47 draft lifecycle)
        run: .github/scripts/verify-harness.sh "drafts" db:verify:drafts

      - name: Pebble visibility (grade RLS)
        if: '!cancelled()'
        run: .github/scripts/verify-harness.sh "visibility" db:verify:visibility

      - name: Public profile projection
        if: '!cancelled()'
        run: .github/scripts/verify-harness.sh "public-profile" db:verify:public-profile

      - name: Privileged profile columns (#739 guard)
        if: '!cancelled()'
        run: .github/scripts/verify-harness.sh "guard" db:verify:guard

      # Read-only, and the only harness that signs nobody up: it compares the
      # linked project against packages/supabase/reference/*.json. Studio stays
      # the editing surface for palettes, so this reports the day the committed
      # snapshot falls behind — see #796.
      - name: Emotion reference data (#796 drift)
        if: '!cancelled()'
        run: .github/scripts/verify-harness.sh "reference" db:verify:reference

      # The UGC report path (#831). Anon-only by design: it proves the visibility
      # gate, the enumeration-resistance property and that the table is opaque.
      # The positive admin path and the takedown dispatch need an admin, so they
      # live in verify-account-purge.ts, which CI does not run.
      - name: Content reports (#831 UGC report path)
        if: '!cancelled()'
        run: .github/scripts/verify-harness.sh "reports" db:verify:reports

      # One writer for the whole table. `always()` so it still reports when a
      # harness failed — that is precisely the run whose table is worth reading.
      - name: Write the run log
        if: always()
        run: |
          {
            echo "### Contract harnesses — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| Harness | Result | Asserts |"
            echo "|---|---|---|"
            cat "${HARNESS_ROWS:-/dev/null}" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      # Nightly only. A PR failure needs no issue — the red check is already in
      # front of the person who caused it — but a scheduled failure otherwise
      # ends in an inbox. One issue, reused: repeat failures comment on it
      # rather than opening a new one, so a contract that stays broken for a
      # week is one thread, not seven. Closed by hand once it is actually fixed,
      # so an intermittent failure cannot quietly close its own report.
      - name: Open or update the nightly tracking issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='[Bug] Nightly contract harnesses are failing'
          # Defaulted: if the job died before the log step ran, the variable
          # was never exported, and `-u` would abort the report itself.
          failures="${HARNESS_FAILURES:-/dev/null}"
          if [ -s "$failures" ]; then
            broke=$(paste -sd', ' "$failures")
          else
            broke='the job failed before any harness reported'
          fi
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The nightly run of the database contract harnesses went red: **$broke**." \
            "Run: $RUN_URL" \
            "Reproduce locally with \`set -a; . ./.env; set +a; npm run db:verify --workspace=packages/supabase\`. See \`packages/supabase/CLAUDE.md\` for what each harness proves. Close this issue by hand once the contract is fixed.")
          existing=$(gh issue list --state open --label bug --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "commented on #$existing"
          else
            gh issue create --title "$title" --body "$body" \
              --label bug --label supabase --label test
          fi

  # ---------------------------------------------------------------------------
  # The two jobs below are what #741 deliberately did not build. `verify` proves
  # RUNTIME behaviour against the linked production project; nothing proved the
  # code compiles or that the schema builds. `packages/supabase` had a `lint`
  # that was `echo 'placeholder'` and a `build` (`tsc --noEmit`) no workflow
  # invoked, and no deploy covered either: `apps/web` does not declare
  # @pbbls/supabase at all, so only the apps/admin Vercel build touches the
  # package, and only through the generated `types/database.ts`. The four edge
  # functions — `delete-account` among them, the GDPR deletion path and the
  # teardown every harness depends on — were typechecked by nobody and are
  # deployed by hand.
  #
  # Neither job needs a secret, so neither carries `verify`'s fork gate: an
  # outside contributor's PR gets typechecked and gets its migrations applied.
  #
  # Both skip the nightly. The nightly exists because production state can drift
  # under a PR that never touched this path; a typecheck and a migration replay
  # are functions of the committed tree alone, so running them at 04:17 can only
  # repeat what the last PR run already said. (They would also report into
  # nothing — the tracking-issue step keys off the harness ledger.)

  checks:
    name: typecheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Before the checks, not between them: a later step guarded by
      # `!cancelled()` cannot run if the toolchain it needs was skipped.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install
        run: npm ci

      # Two branches that both add a migration at the same second produce two
      # files the CLI orders arbitrarily, and `db reset` is happy to apply them
      # in either order. Cheap to check, and this repo has already paid once for
      # a parallel-migration collision (#687).
      - name: Migration versions are unique
        run: |
          dups=$(ls packages/supabase/supabase/migrations | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::Duplicate migration version prefixes: $dups"
            exit 1
          fi

      # `!cancelled()` throughout so a red PR names every problem at once rather
      # than one per push — the house pattern from the harness steps above.
      - name: tsc --noEmit
        if: '!cancelled()'
        run: npm run build --workspace=packages/supabase

      # Covers the four function entrypoints and the seven scripts; `_shared/`
      # and `_shared/engine/` come along transitively through their imports.
      # `deno check`, not `deno lint`: the only thing `deno lint` has to say
      # about this tree is 13 × no-import-prefix, and inline `https://esm.sh/…`
      # specifiers are how Supabase edge functions are written.
      - name: deno check
        if: '!cancelled()'
        run: npm run lint --workspace=packages/supabase

      # The engine's unit tests. They are here rather than in `verify` because
      # they need no database: the compositor is a pure function, and what they
      # assert is that untrusted stroke data cannot leave it as markup (#829).
      # That property is worth a gate of its own — it is the one the stored-XSS
      # finding turned on, and it regresses silently.
      - name: deno test
        if: '!cancelled()'
        run: npm run test --workspace=packages/supabase

  schema:
    name: migration chain · types drift
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned, not `latest`. `gen types` output is this job's assertion, and an
      # unpinned CLI would turn a generator change into a red check on a PR that
      # touched nothing.
      #
      # NOT the 2.84.2 the maintainer happens to run locally: the committed
      # types/database.ts carries `__InternalSupabase` / `PostgrestVersion` and
      # parenthesized conditional generics, and 2.84.2 emits neither — that file
      # came from a newer generator (the dashboard, or the `generate_typescript_types`
      # MCP tool named as a fallback in packages/supabase/CLAUDE.md). Pinning the
      # older CLI here would make the job demand a downgrade of the committed file.
      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Excludes only what this job cannot use: no request is served, no mail is
      # sent, no function is invoked. `storage` and `auth` stay — migrations
      # insert into `storage.buckets` and 66 of them reference `auth.users`.
      - name: Boot the local stack
        working-directory: packages/supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime

      # `supabase start` already applied the chain, but it applied it as a side
      # effect. This is the assertion, stated as one: 68 migrations, empty
      # database, seed included. It is what would have caught a migration
      # referencing a column an earlier one dropped at the DDL level.
      - name: Apply every migration to an empty database
        working-directory: packages/supabase
        run: supabase db reset

      # AGENTS.md makes regenerating and committing types/database.ts mandatory
      # after any migration change, and nothing enforced it: a forgotten
      # regeneration stays invisible until a client reads a column the generated
      # types do not have.
      #
      # Generated to a temp file, never over the committed one. `db:types`
      # redirects the CLI's stdout into the file, so a failed generation
      # TRUNCATES database.ts — the TS1434 failure mode documented in
      # packages/supabase/CLAUDE.md. Here that would silently turn a broken
      # generator into a 4000-line "drift".
      - name: Types match the migrations
        working-directory: packages/supabase
        run: |
          set -uo pipefail
          generated="$RUNNER_TEMP/database.ts"
          supabase gen types typescript --local 2>/dev/null > "$generated"
          if [ ! -s "$generated" ]; then
            echo "::error::supabase gen types produced nothing — the generator failed, not the types."
            exit 1
          fi
          # Not a byte-for-byte diff, for one structural reason: the
          # __InternalSupabase / PostgrestVersion block is emitted only when
          # generating against a LINKED project (the version is read from that
          # project's API), so a `--local` generation can never reproduce it. It
          # describes the server, not the schema. The normaliser removes it from
          # BOTH sides — never one — and settles the trailing newline `gen types`
          # is inconsistent about across versions. Everything else is compared
          # exactly; a renamed column or a dropped function survives untouched.
          # Absolute: this step runs with working-directory packages/supabase.
          "$GITHUB_WORKSPACE/.github/scripts/normalize-db-types.py" \
            types/database.ts "$RUNNER_TEMP/committed.ts" \
            "$generated"      "$RUNNER_TEMP/generated.ts"
          if ! diff -u "$RUNNER_TEMP/committed.ts" "$RUNNER_TEMP/generated.ts"; then
            echo "::error::types/database.ts is out of date. Run 'npm run db:types --workspace=packages/supabase' and commit the result."
            exit 1
          fi
          echo "types/database.ts matches the migrations."

      # Containers are the runner's problem once the job ends, but a failed
      # `db reset` can leave the stack up long enough to hold the port on a
      # retry of the same runner.
      - name: Stop the local stack
        if: always()
        working-directory: packages/supabase
        run: supabase stop --no-backup || true
