# Single source of truth for dependency versions (D2).
# Kept minimal for sub-project A (scaffold). supabase-kt,
# AndroidSVG and Coil arrive with the design system / Path work (B/D).
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ktlint = "14.2.0"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycleRuntimeKtx = "2.11.0"
composeBom = "2026.09.00"
# Over the BOM's 1.4.0 (#853): 1.4.0 keeps MotionScheme.expressive(), the
# *Emphasized type getters and the increased shape steps internal. alpha27 is
# the newest alpha whose Compose deps (1.12.0-beta01) sit under the BOM's
# stable 1.12.1 — alpha28+ drag ui/foundation/runtime to 1.13.0-alpha01.
# Drop this line when 1.5.0 stable is in the BOM.
# Held on alpha27 on purpose (see above), so lint's "newer version" finding for
# it is expected until the pin is dropped.
#noinspection GradleDependency
material3 = "1.5.0-alpha27"
# Large screens (#855). The adaptive info (window size class) that the
# navigation suite and the glyph toolbar read. navigation-suite has no version
# of its own: it ships in lockstep with material3 and must stay on its pin.
material3Adaptive = "1.3.0"
# WindowSizeClass, which adaptive exposes in its own API. Declared so the
# direct call site (isWideWindow) has a direct dependency, not a transitive one.
windowCore = "1.5.1"
junit = "4.13.2"
coroutines = "1.11.0"
# Google's official Compose Preview Screenshot Testing (renders @Preview to PNG
# on the JVM, no device/emulator, no Robolectric). Still alpha — see CLAUDE.md.
#
# STRICTLY pinned, unlike every other entry here, because the committed reference
# PNGs under app/src/screenshotTestDebug/reference/ are only meaningful against
# one renderer: a layoutlib change of any size re-baselines the whole suite, and
# `strictly` turns "Dependabot moved it" from 162 mystery diffs into a resolution
# failure that names the version. It also guards app/build.gradle.kts's reach into
# the validation task's `threshold` input, which alpha16 exposes only as a task
# property (the plugin's own TODO is to promote it to a DSL).
#
# Bumping it is a deliberate, isolated commit that re-runs the re-baseline job —
# see "Screenshot validation gate" in apps/android/CLAUDE.md.
screenshot = { strictly = "0.0.1-alpha16" }
# Entry funnel (sub-project C). supabase-kt is the auth/data client; it needs a
# Ktor engine on the classpath — supabase-kt 3.1.4 is built against Ktor 3.1.2,
# so the OkHttp engine is pinned to the same version to avoid Ktor version skew.
supabase = "3.8.0"
ktor = "3.6.0"
kotlinxSerializationJson = "1.11.0"
# Custom Tabs — the in-app-browser analog of iOS SFSafariViewController, used
# for the legal document links (D15).
browser = "1.10.0"
# render_svg rendering (D10, sub-project D) — parses the server-composed pebble
# SVG strings straight from the RPC rows (the iOS SVGView analog). The -aar
# artifact is the maintained one; the plain jar is legacy.
androidsvg = "1.4"
# Snap thumbnails (sub-project D) — Coil 3 loads the signed storage URLs; the
# okhttp fetcher reuses the OkHttp already on the classpath via ktor-client-okhttp
# (the AsyncImage analog of iOS AsyncImage + SnapURLCache).
coil = "3.6.3"

# Invite QR codes (M49). Encode-only use of the pure-JVM `core` artifact — no
# `android-core`, no camera/scanning: a stock camera app reads the code, and the
# encoder stays unit-testable off-device.
zxing = "3.5.4"

# System splash screen (#846). The androidx compat layer over the API 31+
# platform splash: it owns the pre-draw hold (setKeepOnScreenCondition) that
# replaced RootScreen's fixed 2.5s timer.
splashscreen = "1.2.0"

# DI (#848, supersedes M38 D4). KSP has decoupled from the Kotlin version line —
# it is versioned independently now, so this does NOT track `kotlin` above.
# Verified against AGP 9.4.1's built-in Kotlin, where no KGP is applied by the
# module: `:app:assembleDebug` runs hiltCollectClasses/hiltAggregateDeps/hiltJavaCompile green.
ksp = "2.3.12"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"

# Navigation 3 (#852, supersedes M38 D5). Stable — none of these are alpha.
# navigation3-runtime/-ui are the back stack and the display; the lifecycle
# artifact supplies rememberViewModelStoreNavEntryDecorator, which is what
# scopes a ViewModel to a NavEntry rather than to the screen hosting it.
#
# lifecycleViewmodelNavigation3 deliberately tracks `lifecycleRuntimeKtx`
# (2.11.0) rather than carrying its own number: androidx ships lifecycle-* as
# one coordinated release and mixing versions across the group is the classic
# NoSuchMethodError.
navigation3 = "1.2.0"
navigationEvent = "1.1.2"

# Konsist (#851) — the architecture boundary test. A plain JVM unit test that
# parses the Kotlin sources and asserts the core/features split, so it runs in
# `testDebugUnitTest` with everything else and needs no CI wiring of its own.
#
# NOTE the group is `com.lemonappdev`, not the `io.lemonappdev` the issue text
# quotes — the latter does not exist on Maven Central.
konsist = "0.17.3"

# Baseline + startup profiles (#856). profileinstaller writes the shipped
# profile into ART on install, so the first launches after an install or update
# run pre-compiled code instead of interpreting it. The generator lives in the
# :baselineprofile test module and runs on a device, by hand — see
# apps/android/CLAUDE.md. benchmark ships the Gradle plugin and the
# macrobenchmark rules on one version line, so both ride this one ref.
profileinstaller = "1.4.1"
benchmark = "1.5.0"
uiautomator = "2.4.0"
androidxTestExtJunit = "1.3.0"

# Compose UI tests on the JVM (#857). Robolectric runs the real framework inside
# `testDebugUnitTest`, so these need no emulator and no CI wiring of their own.
# 4.17 is the first release with an SDK 37 android-all jar, which matches
# compileSdk. The Compose ui-test artifacts are BOM-managed (no version here).
# There is no navigation3-testing artifact to add: Nav 3 back stacks are plain
# SnapshotStateLists, driven through the real UI instead.
robolectric = "4.17"
# Declared only to lift what ui-test-junit4 drags in transitively (espresso 3.5,
# test-core 1.5): espresso 3.5 reflects on InputManager.getInstance(), which
# SDK 37 removed, so every Compose test fails at its first idle wait. Drop these
# once the Compose BOM's ui-test depends on the 1.7 line itself.
espresso = "3.7.0"
androidxTestCore = "1.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "material3" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
androidx-window-core = { group = "androidx.window", name = "window-core", version.ref = "windowCore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "screenshot" }

# Compose (BOM-managed; no version here). foundation supplies HorizontalPager.
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }

# supabase-kt entry-funnel stack (sub-project C).
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
# Test-only: builds a real HttpResponse so a JVM test can construct the
# RestException supabase-kt throws, rather than a stand-in that would
# classify differently from the real thing (#849/#850).
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
# Architecture boundary test (#851). Test-only; see the version note above.
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Read-only Path timeline (sub-project D).
androidsvg = { group = "com.caverock", name = "androidsvg-aar", version.ref = "androidsvg" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Invite QR codes (M49).
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
supabase-storage = { group = "io.github.jan-tennert.supabase", name = "storage-kt" }

# Pebble write path (M39 sub-project A). The Functions plugin registers the
# compose-pebble / compose-pebble-update edge-function surface; PebbleWriteService
# posts via raw Ktor to read the 5xx soft-success body (D2).
supabase-functions = { group = "io.github.jan-tennert.supabase", name = "functions-kt" }

# Branded cold-start splash (#846).
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# ViewModel + lifecycle-aware collection (#849). All three ride the same
# lifecycleRuntimeKtx version: androidx ships lifecycle-* as one coordinated
# release, and mixing versions across the group is the classic NoSuchMethodError.
#
#  - runtime-compose    collectAsStateWithLifecycle / repeatOnLifecycle in Compose
#  - viewmodel-compose  viewModel(); hiltViewModel() is layered on top of it
#  - viewmodel-savedstate  SavedStateHandle, for what must survive process death
#
# viewmodel-compose arrives transitively through hilt-navigation-compose; it is
# declared anyway, because a transitive API is one dependency bump away from
# vanishing and the compile error then points at the wrong library.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycleRuntimeKtx" }

# Hilt (#848). hilt-navigation-compose supplies hiltViewModel(), which #849 uses.
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Navigation 3 (#852). material3-adaptive-navigation3 supplies the list-detail
# Scene (#940). It ships in lockstep with material3-adaptive, so it rides the
# same ref, and its own navigation3-ui floor (1.0.0) resolves up to ours.
androidx-compose-material3-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "material3Adaptive" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleRuntimeKtx" }
androidx-navigationevent-compose = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "navigationEvent" }

# Baseline profiles (#856).
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

# Compose UI tests on the JVM (#857). ui-test-manifest registers the empty
# ComponentActivity `createComposeRule()` launches; hilt-android-testing swaps the
# production modules for the fakes in src/test/.../testing/.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 has built-in Kotlin but does NOT bundle the Compose compiler — it must
# still be applied, pinned to the same version as the Kotlin compiler in use.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Generates serializers for the hand-written @Serializable models (sub-project
# D — the funnel only ever decoded JsonObject, which needs no codegen).
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# The :baselineprofile module is a com.android.test module aimed at :app (#856).
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
