name: Pebbles
options:
  bundleIdPrefix: app.pbbls
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: 256Z7G8WLM
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

# Pinned exactly, not `from:`. Package.resolved lives inside the generated
# .xcodeproj, which is git-ignored, so `from:` meant every clean checkout
# resolved whatever was newest that day while this machine kept building
# against a resolved file from months ago. That is not a hypothetical: the
# first CI run of the test job (#790) failed to compile because supabase-swift
# had moved 2.43.1 → 2.55.x and `createSignedURLs` now returns
# [SignedURLResult] rather than [URL]. Xcode Cloud clones clean too, so the
# release build was resolving the same drifting graph.
#
# These three versions are what the shipped app is actually built against.
# Bumping one is a deliberate PR that fixes the API changes it brings, not
# something a Tuesday afternoon does on its own.
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: "2.43.1"
  SVGView:
    url: https://github.com/exyte/SVGView
    exactVersion: "1.0.6"
  RiveRuntime:
    url: https://github.com/rive-app/rive-ios
    exactVersion: "6.19.2"

targets:
  Pebbles:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Pebbles
      - path: Shared
      # Privacy manifest — declared explicitly rather than left to XcodeGen's
      # extension inference. One per shippable bundle; never in Shared/, which
      # is compiled into both targets.
      - path: Pebbles/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pbbls.ios
        PRODUCT_NAME: Pebbles
        INFOPLIST_FILE: Pebbles/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pebbles/Pebbles.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    dependencies:
      - package: Supabase
        product: Supabase
      - package: SVGView
        product: SVGView
      - package: RiveRuntime
        product: RiveRuntime
      - target: PebblesWidget
        embed: true

  PebblesWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PebblesWidget
      - path: Shared
      - path: PebblesWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pbbls.ios.widget
        PRODUCT_NAME: PebblesWidget
        INFOPLIST_FILE: PebblesWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        TARGETED_DEVICE_FAMILY: "1"

  PebblesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PebblesTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pbbls.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pebbles
    postBuildScripts:
      - name: Copy Localizable.xcstrings into test bundle
        inputFiles:
          - $(SRCROOT)/Pebbles/Resources/Localizable.xcstrings
        outputFiles:
          - $(CODESIGNING_FOLDER_PATH)/Localizable.xcstrings
        script: |
          cp "${SRCROOT}/Pebbles/Resources/Localizable.xcstrings" "${CODESIGNING_FOLDER_PATH}/Localizable.xcstrings"

schemes:
  Pebbles:
    build:
      targets:
        Pebbles: all
        PebblesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PebblesTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
